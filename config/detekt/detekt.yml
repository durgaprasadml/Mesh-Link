build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2

complexity:
  active: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
    thresholdInInterfaces: 20

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: false

naming:
  active: true
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'

style:
  active: true
  UnusedPrivateMember:
    active: true
