# Gradle Daemon JVM Configuration - Optimized for Apple Silicon M3 / macOS build performance
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin Compiler Daemon JVM Configuration
kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -XX:+TieredCompilation

# Gradle Performance Flags
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

# Android Gradle Plugin Performance
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableR8.fullMode=false

# Kotlin & KSP Incremental Compilation
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
ksp.incremental.intermodule=true
room.incremental=true

