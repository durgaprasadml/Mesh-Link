# Gradle Daemon JVM Configuration - Tuned for Apple Silicon M3 & heavy KSP workloads
org.gradle.jvmargs=-Xmx8192m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:+ParallelRefProcEnabled -XX:+UnlockExperimentalVMOptions -XX:G1HeapRegionSize=32m -XX:MaxGCPauseMillis=20 -Dfile.encoding=UTF-8

# Kotlin Compiler Daemon JVM Configuration
kotlin.daemon.jvmargs=-Xmx6144m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:+UseStringDeduplication

# Gradle Performance Flags
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

# Android Gradle Plugin Performance & R Class Optimizations
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.enableR8.fullMode=false

# Kotlin & KSP Incremental Compilation
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
room.incremental=true
