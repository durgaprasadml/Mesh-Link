# Gradle Daemon JVM Configuration - Optimized for Apple Silicon M3 to prevent swapping
# Balanced allocation to avoid OS-level swapping which causes 30m+ build times
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -XX:+ParallelRefProcEnabled -XX:+UnlockExperimentalVMOptions -XX:G1HeapRegionSize=32m -XX:MaxGCPauseMillis=20 -Dfile.encoding=UTF-8

# Kotlin Compiler Daemon JVM Configuration
kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -XX:+UseStringDeduplication -XX:+TieredCompilation

# Gradle Performance Flags
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

# Android Gradle Plugin Performance
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.enableR8.fullMode=false

# Kotlin & KSP Incremental Compilation
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
ksp.incremental.intermodule=true
room.incremental=true
